<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Magnifying glass / lens circle -->
  <circle cx="230" cy="225" r="120" fill="none" stroke="url(#lens)" stroke-width="28" stroke-linecap="round"/>
  <!-- Lens handle -->
  <line x1="320" y1="315" x2="410" y2="405" stroke="url(#lens)" stroke-width="32" stroke-linecap="round"/>

  <!-- Pencil inside the lens -->
  <!-- Pencil body -->
  <line x1="175" y1="280" x2="280" y2="170" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  <!-- Pencil tip -->
  <polygon points="165,290 155,300 175,280" fill="#fbbf24"/>
  <!-- Pencil eraser -->
  <line x1="280" y1="170" x2="295" y2="155" stroke="#fca5a5" stroke-width="22" stroke-linecap="round"/>

  <!-- Small sketch lines inside lens (suggests drawing) -->
  <line x1="195" y1="195" x2="215" y2="195" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="210" x2="235" y2="210" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round"/>
  <line x1="205" y1="225" x2="250" y2="225" stroke="rgba(255,255,255,0.3)" stroke-width="6" stroke-linecap="round"/>
</svg>